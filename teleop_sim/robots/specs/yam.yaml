# I2RT YAM follower arm (MuJoCo Menagerie `i2rt_yam`, vendored in
# assets/i2rt_yam/upstream/) on a table with two water glasses.
#
# Joint limits, gripper travel and camera poses here must match the MJCF;
# tests/test_mjcf_spec.py enforces it. Unlike so101.yaml these are not guesses:
# they come from I2RT's own model. All joint values are RADIANS.

name: yam
version: "1"
mjcf_path: ../../../assets/i2rt_yam/glasses_scene.xml
urdf_path: null

# effort_limit is each actuator's forcerange (Damiao DM4340 for joints 1-3,
# DM4310 for 4-6). vel_limit is left unset rather than invented.
joints:
  - {name: joint1, lower: -2.61799, upper: 3.05433, effort_limit: 28.0}
  - {name: joint2, lower: 0.0,      upper: 3.66519, effort_limit: 28.0}
  - {name: joint3, lower: 0.0,      upper: 3.66519, effort_limit: 28.0}
  - {name: joint4, lower: -1.5708,  upper: 1.5708,  effort_limit: 10.0}
  - {name: joint5, lower: -1.5708,  upper: 1.5708,  effort_limit: 10.0}
  - {name: joint6, lower: -2.0944,  upper: 2.0944,  effort_limit: 10.0}

# Upstream's `home` keyframe, unchanged. At this pose the fingers (which slide
# along link_6's x axis) close horizontally -- the orientation for a side grasp
# on a standing glass -- and the wrist camera on the gripper's +y face is on top.
home: [0.0, 1.047, 1.047, 0.0, 0.0, 0.0]

ee_link: link_6
ee_site: grasp_site

# One actuator drives the left finger; the right follows through an equality
# constraint. Prismatic metres. Open is the joint's hard stop (the actuator
# ctrlrange overshoots it, so commanding open drives into the stop); closed is
# the pads meeting, which lands ~0.2 mm short of 0 -- hence the deadband, so
# "fully closed" still reads exactly 1.0.
gripper:
  joint: left_finger
  actuator: gripper
  open_pos: 0.037524
  closed_pos: 0.0
  deadband: 0.02

cameras:
  - name: top
    mount: world
    pose: [0.22, 0.0, 0.72, 0.701027, 0.092527, -0.092527, -0.701027]
    fovy_deg: 55.0
    resolution: [640, 480]
  - name: wrist
    mount: wrist_d405
    pose: [0.003, 0.0, 0.022, 0.013441, -0.003482, 0.967955, 0.250738]
    fovy_deg: 58.0
    resolution: [640, 480]

# Safety envelope for the grasp point. Enforced by the watchdog once
# autonomous operation begins.
workspace:
  lower: [0.05, -0.50, 0.005]
  upper: [0.70, 0.50, 0.70]

default_control_mode: joint_position
supported_modes: [joint_position]
control_hz: 30.0

# Declared false until verified against I2RT's driver. The DM motors are
# reported to return torque feedback; enabling joint_torque is a one-line
# change once the real signal has been checked.
sensing:
  joint_current: false
  joint_torque: false
  ee_wrench: false
  estop: false
