# I2RT YAM arm, without an end effector.
#
# The model is generated from the vendored Menagerie YAM (see
# assets/i2rt_yam/VENDOR.md) with the stock gripper removed. The arm ends at
# link_6, the flange every end effector attaches to. Joint limits must match
# the MJCF; tests/test_mjcf_spec.py enforces it. All joint values are RADIANS.

name: yam
version: "1"
mjcf_path: ../../../assets/i2rt_yam/yam_arm.xml
root_body: arm
flange: link_6

# effort_limit is each actuator's forcerange (Damiao DM4340 for joints 1-3,
# DM4310 for 4-6). vel_limit is left unset rather than invented.
joints:
  - {name: joint1, lower: -2.61799, upper: 3.05433, effort_limit: 28.0}
  - {name: joint2, lower: 0.0,      upper: 3.66519, effort_limit: 28.0}
  - {name: joint3, lower: 0.0,      upper: 3.66519, effort_limit: 28.0}
  - {name: joint4, lower: -1.5708,  upper: 1.5708,  effort_limit: 10.0}
  - {name: joint5, lower: -1.5708,  upper: 1.5708,  effort_limit: 10.0}
  - {name: joint6, lower: -2.0944,  upper: 2.0944,  effort_limit: 10.0}

# Upstream's `home` keyframe. The fingers of the stock gripper close
# horizontally here, and its wrist camera is on top.
home: [0.0, 1.047, 1.047, 0.0, 0.0, 0.0]

default_control_mode: joint_position
supported_modes: [joint_position]
control_hz: 30.0

# Declared false until verified against I2RT's driver. The DM motors are
# reported to return torque feedback.
sensing:
  joint_current: false
  joint_torque: false
  ee_wrench: false
  estop: false
