# YAM's stock linear gripper (the one Menagerie ships), with a D405-style
# camera on top. Kept as the reference end effector: the production gripper
# is a second description beside this one, attached to the same arm.
#
# Model: assets/end_effectors/yam_linear/yam_linear.xml, generated by
# scripts/build_yam_assets.py. Its root body is attached at the arm's flange.

name: yam_linear
version: "1"
mjcf_path: ../../../assets/end_effectors/yam_linear/yam_linear.xml
root_body: yam_linear
mount: [0, 0, 0, 1, 0, 0, 0]      # root sits exactly at link_6
ee_site: grasp_site

# One actuator drives the left finger; the right follows through an equality
# constraint. Prismatic metres. Open is the joint's hard stop (the actuator
# ctrlrange overshoots it, so commanding open drives into the stop); closed is
# the pads meeting, which lands ~0.2 mm short of 0 -- hence the deadband, so
# "fully closed" still reads exactly 1.0.
gripper:
  joint: left_finger
  actuator: gripper
  open_pos: 0.037524
  closed_pos: 0.0
  deadband: 0.02

# Cameras carried by this end effector. Pose is relative to the mount body and
# must match the MJCF (tests/test_mjcf_spec.py).
cameras:
  - name: wrist
    mount: wrist_d405
    pose: [0.003, 0.0, 0.022, 0.013441, -0.003482, 0.967955, 0.250738]
    fovy_deg: 58.0
    resolution: [640, 480]
