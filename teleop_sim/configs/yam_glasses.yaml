# YAM (arm + stock gripper) placed in the glasses-table cell: wrist camera on
# top of the gripper, overhead `top` camera from the scene. Driven through the
# same loop as every other config.
#
# Swap the end effector in robots/specs/yam.yaml; swap the cell here.

robot:
  type: mujoco
  spec: ../robots/specs/yam.yaml
  scene: ../scenes/glasses_table.yaml
  image_size: [224, 224]   # what the public YAM datasets (ABC-130k) store

source:
  type: policy
  policy: {type: constant}

success:
  type: never

reset:
  type: none

safety:
  type: sim_watchdog
  max_steps: 90
  enforce_workspace: true

task:
  name: yam_glasses_smoke

record:
  fps: 30
  root: data/yam_glasses_smoke

seed: 0
