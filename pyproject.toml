[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teleop-sim"
version = "0.1.0"
description = "Hardware-agnostic teleoperation, imitation learning and autonomous manipulation pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

# Extras keep heavyweight / platform-specific deps off machines that do not need
# them. `core` must stay importable with the base dependencies alone -- CI asserts it.
[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
sim = ["mujoco>=3.2", "mink>=0.0.5"]
train = ["torch>=2.2", "lerobot"]
real-feetech = ["feetech-servo-sdk"]
realsense = ["pyrealsense2"]
# VLM-guided tasks (perception/claude_vision.py)
vlm = ["anthropic>=1.8"]
# A running robots_realtime session over its ZMQ bus (robots/real/rr_bridge.py)
real-rr = ["pyzmq>=25", "msgpack>=1.0", "msgpack-numpy>=0.4.8"]
vr = ["oculus-reader"]

[tool.hatch.build.targets.wheel]
packages = ["teleop_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["teleop_sim", "tests"]
